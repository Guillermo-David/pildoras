# --- Shortcuts dialog ---
shortcuts.dialog.title=Atajos de teclado
shortcuts.section.list.title=LISTADO
shortcuts.section.list.content=Rueda ratón                – Desplazar la lista\nPageUp / Ctrl+←            – Página anterior\nPageDown / Ctrl+→          – Página siguiente\nCtrl+F                     – Foco en filtro de texto\nCtrl+T                     – Foco en filtro de etiquetas\nCtrl+N                     – Nueva píldora\nCtrl+O                     – Abrir detalle de la fila seleccionada\nCtrl+E                     – Editar la fila seleccionada\nSupr                       – Eliminar la fila seleccionada\nM                          – (Tabla enfocada) Alternar favorita\nCtrl+Shift+F               – Mostrar solo favoritas (toggle)\nEsc                        – Limpiar filtros (si hay foco en filtros) / Volver\nDoble clic fila            – Abrir detalle
shortcuts.section.detail.title=DETALLE
shortcuts.section.detail.content=Ctrl+E                     – Editar\nSupr                       – Eliminar\nEsc                        – Volver al listado\nClick en etiqueta          – Filtrar listado por esa etiqueta
shortcuts.section.editor.title=EDITOR
shortcuts.section.editor.content=Ctrl+S / Ctrl+Enter       – Guardar\nEsc                       – Cancelar y volver\nCtrl+B                    – Insertar **negrita**\nCtrl+I                    – Insertar *cursiva*\nCtrl+K                    – Insertar [enlace](https://)\nCtrl+E                    – Insertar `código`\nTab / Shift+Tab           – Indentar / desindentar líneas (listas)\nVista previa              – Conmutador en la barra de herramientas\nEnter / ','               – Confirmar etiqueta en el campo de etiquetas\nBackspace (etiquetas)     – Con input vacío, borrar la última etiqueta
shortcuts.section.drafts.title=BORRADORES
shortcuts.section.drafts.content=Desde Ajustes → Borradores\n  Nuevo borrador…         – Diálogo rápido\n  Bandeja de borradores…  – Lista de borradores\nBandeja\n  Doble clic fila         – Editar borrador\n  Supr                    – Eliminar borrador seleccionado\nDiálogo rápido de borrador\n  Ctrl+S / Ctrl+Enter     – Guardar

