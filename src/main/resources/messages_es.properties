# --- Turso guide ---
guide.turso.title=Cómo configurar Turso
guide.turso.headline=☁ Sincronización en la nube con Turso
guide.turso.intro=Píldoras guarda tus datos de forma local por defecto. Si quieres acceder a tus píldoras desde varios equipos, puedes sincronizarlas con Turso, un servicio gratuito de bases de datos en la nube.\n\nSin Turso, la app funciona perfectamente en local. Turso es totalmente opcional.
guide.turso.steps.title=Pasos para configurar Turso:
guide.turso.steps=1. Crea una cuenta gratuita en turso.tech\n2. Instala la herramienta de Turso en tu terminal:\n     curl -sSfL https://get.tur.so/install.sh | bash\n3. Inicia sesión: turso auth login\n4. Crea una base de datos: turso db create pildoras\n5. Copia la URL: turso db show pildoras --url\n     (Ejemplo: libsql://pildoras-tu-usuario.turso.io)\n6. Genera un token: turso db tokens create pildoras\n7. En Píldoras: Ajustes → Base de datos → Configurar Turso\n     Pega la URL y el token, y pulsa Aceptar.\n8. (Opcional) Migra tus datos locales:\n     Ajustes → Base de datos → Migrar datos locales a Turso
guide.turso.more.info=Más información:

