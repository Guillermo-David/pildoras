# --- Turso guide ---
guide.turso.title=How to configure Turso
guide.turso.headline=☁ Cloud sync with Turso
guide.turso.intro=Pildoras saves your data locally by default. If you want to access your pills from multiple devices, you can sync them with Turso, a free cloud database service.\n\nWithout Turso, the app works perfectly locally. Turso is entirely optional.
guide.turso.steps.title=Steps to configure Turso:
guide.turso.steps=1. Create a free account at turso.tech\n2. Install the Turso CLI in your terminal:\n     curl -sSfL https://get.tur.so/install.sh | bash\n3. Log in: turso auth login\n4. Create a database: turso db create pildoras\n5. Copy the URL: turso db show pildoras --url\n     (Example: libsql://pildoras-your-user.turso.io)\n6. Generate a token: turso db tokens create pildoras\n7. In Pildoras: Settings → Database → Configure Turso\n     Paste the URL and token, and press Accept.\n8. (Optional) Migrate your local data:\n     Settings → Database → Migrate local data to Turso
guide.turso.more.info=More information:

