# --- Shortcuts dialog ---
shortcuts.dialog.title=Keyboard shortcuts
shortcuts.section.list.title=LIST
shortcuts.section.list.content=Mouse wheel                – Scroll the list\nPageUp / Ctrl+←            – Previous page\nPageDown / Ctrl+→          – Next page\nCtrl+F                     – Focus on text filter\nCtrl+T                     – Focus on tag filter\nCtrl+N                     – New pill\nCtrl+O                     – Open detail of selected row\nCtrl+E                     – Edit selected row\nDel                        – Delete selected row\nM                          – (Table focused) Toggle favorite\nCtrl+Shift+F               – Show favorites only (toggle)\nEsc                        – Clear filters (if filter focused) / Back\nDouble-click row           – Open detail
shortcuts.section.detail.title=DETAIL
shortcuts.section.detail.content=Ctrl+E                     – Edit\nDel                        – Delete\nEsc                        – Back to list\nClick on tag               – Filter list by that tag
shortcuts.section.editor.title=EDITOR
shortcuts.section.editor.content=Ctrl+S / Ctrl+Enter       – Save\nEsc                       – Cancel and go back\nCtrl+B                    – Insert **bold**\nCtrl+I                    – Insert *italic*\nCtrl+K                    – Insert [link](https://)\nCtrl+E                    – Insert `code`\nTab / Shift+Tab           – Indent / unindent lines (lists)\nPreview                   – Toggle in the toolbar\nEnter / ','               – Confirm tag in the tag field\nBackspace (tags)          – With empty input, delete the last tag
shortcuts.section.drafts.title=DRAFTS
shortcuts.section.drafts.content=From Settings → Drafts\n  New draft…              – Quick dialog\n  Drafts tray…            – Drafts list\nTray\n  Double-click row        – Edit draft\n  Del                     – Delete selected draft\nQuick draft dialog\n  Ctrl+S / Ctrl+Enter     – Save

